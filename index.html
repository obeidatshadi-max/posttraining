// ── Shared UI ─────────────────────────────────────────────────────────────────
function Tag({ color, bg, children, small }) {
  return <span style={{ background: bg || `${color}18`, color, fontSize: small ? 9 : 10, fontWeight: 700, padding: small ? "2px 6px" : "3px 9px", borderRadius: 6, letterSpacing: "0.04em", whiteSpace: "nowrap" }}>{children}</span>;
}

function Btn({ onClick, color = C.accent, outline, children, full, small, disabled }) {
  return (
    <button onClick={onClick} disabled={disabled}
      style={{ width: full ? "100%" : "auto", padding: small ? "7px 13px" : "11px 18px", background: outline ? "transparent" : (disabled ? C.subtle : color), border: `1.5px solid ${outline ? C.border : color}`, borderRadius: 10, color: outline ? C.textSoft : C.white, fontSize: small ? 11 : 13, fontWeight: 700, cursor: disabled ? "default" : "pointer", fontFamily: "inherit", opacity: disabled ? 0.5 : 1 }}>
      {children}
    </button>
  );
}

function Card({ children, style }) {
  return <div style={{ background: C.card, border: `1px solid ${C.border}`, borderRadius: 16, boxShadow: C.shadow, ...style }}>{children}</div>;
}

function Ring({ pct, color, size = 48, stroke = 4, label }) {
  const r = (size - stroke * 2) / 2, circ = 2 * Math.PI * r, dash = (pct / 100) * circ;
  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)", position: "absolute", inset: 0 }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.border} strokeWidth={stroke} />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: label ? 10 : 11, fontWeight: 700, color: label ? C.text : color }}>{label || `${pct}%`}</div>
    </div>
  );
}

function PBar({ pct, color = C.accent, h = 6 }) {
  return <div style={{ height: h, background: C.subtle, borderRadius: h, overflow: "hidden" }}><div style={{ width: `${pct}%`, height: "100%", background: color, borderRadius: h, transition: "width 0.8s" }} /></div>;
}

function Avatar({ initials, color = C.accent, size = 38 }) {
  return <div style={{ width: size, height: size, borderRadius: "50%", background: `${color}18`, border: `1.5px solid ${color}44`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: size * 0.28, fontWeight: 700, color, flexShrink: 0 }}>{initials}</div>;
}

function SectionHead({ label, title, sub }) {
  return (
    <div style={{ marginBottom: 20 }}>
      {label && <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.12em", color: C.muted, textTransform: "uppercase", marginBottom: 4 }}>{label}</div>}
      <div style={{ fontSize: 22, fontWeight: 800, fontFamily: "'DM Serif Display',serif", color: C.text }}>{title}</div>
      {sub && <div style={{ fontSize: 13, color: C.muted, marginTop: 3 }}>{sub}</div>}
    </div>
  );
}

function StarRating({ value, onChange, size = 20 }) {
  return (
    <div style={{ display: "flex", gap: 4 }}>
      {[1,2,3,4,5].map(s => (
        <button key={s} onClick={() => onChange && onChange(s)}
          style={{ background: "none", border: "none", cursor: onChange ? "pointer" : "default", fontSize: size, color: s <= value ? C.amber : C.border, padding: 0 }}>★</button>
      ))}
    </div>
  );
}

// ── AI Coach Modal ────────────────────────────────────────────────────────────
function AIModal({ onClose }) {
  const [input, setInput] = useState("");
  const [msgs, setMsgs] = useState([{ role: "assistant", text: "I've reviewed Ahmad's patterns. He understands SPIN conceptually but skips Implication questions under time pressure. What would you like to explore?" }]);
  const [loading, setLoading] = useState(false);
  const endRef = useRef(null);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [msgs]);
  const send = async () => {
    if (!input.trim() || loading) return;
    const msg = input.trim(); setInput("");
    setMsgs(m => [...m, { role: "user", text: msg }]); setLoading(true);
    try {
      const history = [...msgs, { role: "user", text: msg }];
      const res = await fetch("/.netlify/functions/claude", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system: "You are an AI Behavioral Coaching Engine. Context: Ahmad Khalil, pharma rep, Day 47 SPIN Selling journey, Phase 3. He rushes Implication questions. Be specific, direct, warm. Max 4 sentences. Ask one coaching question.", messages: history.map(m => ({ role: m.role, content: m.text })) }) });
      const data = await res.json();
      setMsgs(m => [...m, { role: "assistant", text: data.text || "Let me reflect on that." }]);
    } catch { setMsgs(m => [...m, { role: "assistant", text: "Connection issue. Try again." }]); }
    setLoading(false);

        <div style={{ width: 36, height: 36, borderRadius: "50%", background: `linear-gradient(135deg,${C.accent},${C.accentLight})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>✦</div>
        <div><div style={{ fontSize: 14, fontWeight: 700, color: C.text }}>AI Coaching Engine</div><div style={{ fontSize: 11, color: C.accentMid }}>● Live · Ahmad Khalil · Day 47</div></div>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: "18px 16px", display: "flex", flexDirection: "column", gap: 12 }}>
        {msgs.map((m, i) => (

            <div style={{ maxWidth: "80%", padding: "11px 14px", borderRadius: m.role === "user" ? "16px 16px 4px 16px" : "16px 16px 16px 4px", background: m.role === "user" ? `linear-gradient(135deg,${C.accent},${C.accentMid})` : C.white, border: m.role === "assistant" ? `1px solid ${C.border}` : "none", fontSize: 13, lineHeight: 1.65, color: m.role === "user" ? C.white : C.text, boxShadow: C.shadow }}>{m.text}</div>
          </div>
        ))}
        {loading && <div style={{ display: "flex", gap: 5, padding: "11px 14px", background: C.white, borderRadius: "16px 16px 16px 4px", width: 72, border: `1px solid ${C.border}` }}>{[0,1,2].map(i => <div key={i} style={{ width: 7, height: 7, borderRadius: "50%", background: C.accentLight, animation: `dot 1.2s ${i*.2}s infinite` }} />)}</div>}
        <div ref={endRef} />
      </div>
      <div style={{ padding: "12px 16px 24px", borderTop: `1px solid ${C.border}`, background: C.surface, display: "flex", gap: 10 }}>
        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()} placeholder="Ask about behavioral patterns…" style={{ flex: 1, background: C.subtle, border: `1px solid ${C.border}`, borderRadius: 24, padding: "11px 16px", color: C.text, fontSize: 13, outline: "none", fontFamily: "inherit" }} />

    </div>
  );
}

// NOTIFICATIONS PANEL — the accountability loop (Priority 1)
// ════════════════════════════════════════════════════════════════════════
function NotificationsPanel({ items, onUpdate, onClose }) {
  const unread = items.filter(n => !n.read).length;

  const markAll = () => onUpdate(items.map(n => ({ ...n, read: true })));
  const markOne = (id) => onUpdate(items.map(n => n.id === id ? { ...n, read: true } : n));

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 280, maxWidth: 430, margin: "0 auto" }}>
      {/* Backdrop */}
      <div onClick={onClose} style={{ position: "absolute", inset: 0, background: "rgba(15,36,23,0.35)", backdropFilter: "blur(2px)" }} />
      {/* Sheet */}
      <div style={{ position: "absolute", top: 0, left: 0, right: 0, background: C.bg, borderRadius: "0 0 24px 24px", maxHeight: "82vh", display: "flex", flexDirection: "column", boxShadow: "0 12px 40px rgba(0,0,0,0.18)", animation: "slideDown 0.25s ease" }}>
        {/* Header */}
        <div style={{ padding: "16px 18px 12px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `1px solid ${C.border}`, background: C.white, borderRadius: "0 0 0 0" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ fontSize: 17, fontWeight: 800, fontFamily: "'DM Serif Display',serif", color: C.text }}>Notifications</div>
            {unread > 0 && <div style={{ padding: "2px 9px", background: C.rose, borderRadius: 12, fontSize: 10, fontWeight: 700, color: C.white }}>{unread} new</div>}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            {unread > 0 && (
              <button onClick={markAll} style={{ padding: "5px 11px", background: C.accentSoft2, border: `1px solid ${C.accentLight}55`, borderRadius: 9, fontSize: 11, fontWeight: 700, color: C.accent, cursor: "pointer" }}>Mark all read</button>
            )}
            <button onClick={onClose} style={{ width: 30, height: 30, borderRadius: "50%", background: C.subtle, border: `1px solid ${C.border}`, color: C.muted, fontSize: 14, cursor: "pointer" }}>✕</button>
          </div>
        </div>

        {/* List */}
        <div style={{ overflowY: "auto", padding: "12px 14px 20px" }}>
          {items.length === 0 && (
            <div style={{ padding: "36px 20px", textAlign: "center", color: C.muted }}>
              <div style={{ fontSize: 30, marginBottom: 10 }}>🔔</div>
              <div style={{ fontSize: 13 }}>You're all caught up.</div>
            </div>
          )}
          {items.map(n => (
            <button key={n.id} onClick={() => markOne(n.id)}
              style={{ width: "100%", textAlign: "left", padding: 0, background: "none", border: "none", cursor: "pointer", marginBottom: 9 }}>
              <div style={{ background: n.read ? C.white : `${n.color}08`, border: `1.5px solid ${n.read ? C.border : n.color + "44"}`, borderRadius: 14, padding: "13px 14px", display: "flex", gap: 12, alignItems: "flex-start", boxShadow: C.shadow, position: "relative" }}>
                {!n.read && <div style={{ position: "absolute", top: 13, right: 13, width: 8, height: 8, borderRadius: "50%", background: n.color }} />}
                <div style={{ width: 38, height: 38, borderRadius: 11, background: `${n.color}14`, border: `1px solid ${n.color}33`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 17, flexShrink: 0 }}>{n.icon}</div>
                <div style={{ flex: 1, minWidth: 0, paddingRight: 14 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 2 }}>{n.title}</div>
                  <div style={{ fontSize: 12, color: C.textSoft, lineHeight: 1.55 }}>{n.body}</div>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 7 }}>
                    <span style={{ fontSize: 10, color: C.muted }}>{n.time}</span>
                    {n.action && <span style={{ fontSize: 11, fontWeight: 700, color: n.color }}>{n.action} →</span>}
                  </div>
                </div>
              </div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// BASELINE CHECK-IN — Day 0 / 45 / 90 self-assessment (Priority 2)
// ════════════════════════════════════════════════════════════════════════
function BaselineCheckIn({ journeyColor }) {
  // stage: "prompt" → "form" → "done"
  const [stage, setStage] = useState("prompt");
  const [answers, setAnswers] = useState({});
  const [qIndex, setQIndex] = useState(0);

  const q = BASELINE_QUESTIONS[qIndex];
  const allAnswered = Object.keys(answers).length === BASELINE_QUESTIONS.length;

  const avgBefore = Object.values(BASELINE_DAY0).reduce((a, b) => a + b, 0) / BASELINE_QUESTIONS.length;
  const avgNow = allAnswered ? Object.values(answers).reduce((a, b) => a + b, 0) / BASELINE_QUESTIONS.length : 0;

  // ── Prompt card ──
  if (stage === "prompt") {
    return (
      <Card style={{ padding: "16px", marginBottom: 14, border: `1.5px solid ${C.purple}44`, background: `linear-gradient(135deg, ${C.purpleSoft} 0%, ${C.white} 70%)` }}>
        <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
          <div style={{ width: 44, height: 44, borderRadius: 13, background: `${C.purple}15`, border: `1.5px solid ${C.purple}33`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 21, flexShrink: 0 }}>📊</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: C.text }}>Day 45 Check-In Due</div>
            <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>5 questions · 2 minutes · compares against your Day 0 baseline</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          <Btn full color={C.purple} onClick={() => setStage("form")}>Start Check-In</Btn>
          <Btn outline onClick={() => setStage("dismissed")}>Later</Btn>
        </div>
      </Card>
    );
  }

  if (stage === "dismissed") {
    return (
      <button onClick={() => setStage("prompt")} style={{ width: "100%", padding: "10px 14px", background: C.purpleSoft, border: `1px dashed ${C.purple}44`, borderRadius: 12, cursor: "pointer", fontSize: 12, fontWeight: 700, color: C.purple, marginBottom: 14, textAlign: "center" }}>
        📊 Day 45 Check-In pending — tap to resume
      </button>
    );
  }

  // ── Question-by-question form ──
  if (stage === "form") {
    return (
      <Card style={{ padding: "18px", marginBottom: 14, border: `1.5px solid ${C.purple}55` }}>
        {/* Progress */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: C.purple, letterSpacing: "0.07em" }}>DAY 45 CHECK-IN</div>
          <div style={{ fontSize: 11, color: C.muted, fontWeight: 700 }}>{qIndex + 1} / {BASELINE_QUESTIONS.length}</div>
        </div>
        <div style={{ display: "flex", gap: 4, marginBottom: 18 }}>
          {BASELINE_QUESTIONS.map((_, i) => (
            <div key={i} style={{ flex: 1, height: 4, borderRadius: 2, background: i < qIndex || answers[BASELINE_QUESTIONS[i].id] ? C.purple : C.border, opacity: i === qIndex ? 1 : 0.5 }} />
          ))}
        </div>

        {/* Question */}
        <div style={{ fontSize: 15, fontWeight: 700, color: C.text, lineHeight: 1.45, marginBottom: 16, fontFamily: "'DM Serif Display',serif" }}>{q.text}</div>

        {/* 1–5 scale */}
        <div style={{ display: "flex", gap: 7, marginBottom: 8 }}>
          {[1, 2, 3, 4, 5].map(v => {
            const selected = answers[q.id] === v;
            return (
              <button key={v} onClick={() => setAnswers({ ...answers, [q.id]: v })}
                style={{ flex: 1, padding: "14px 4px", background: selected ? `${C.purple}18` : C.subtle, border: `2px solid ${selected ? C.purple : C.border}`, borderRadius: 12, cursor: "pointer", fontSize: 16, fontWeight: 800, color: selected ? C.purple : C.muted, transition: "all 0.12s" }}>
                {v}
              </button>
            );
          })}
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}>
          <span style={{ fontSize: 10, color: C.muted }}>{q.low}</span>
          <span style={{ fontSize: 10, color: C.muted }}>{q.high}</span>
        </div>

        {/* Nav */}
        <div style={{ display: "flex", gap: 8 }}>
          {qIndex > 0 && <Btn outline onClick={() => setQIndex(qIndex - 1)}>← Back</Btn>}
          {qIndex < BASELINE_QUESTIONS.length - 1 ? (
            <Btn full color={C.purple} disabled={!answers[q.id]} onClick={() => answers[q.id] && setQIndex(qIndex + 1)}>Next →</Btn>
          ) : (
            <Btn full color={C.purple} disabled={!allAnswered} onClick={() => allAnswered && setStage("done")}>Complete Check-In</Btn>
          )}
        </div>
      </Card>
    );
  }

  // ── Before/After results ──
  return (
    <Card style={{ padding: "18px", marginBottom: 14, border: `1.5px solid ${C.purple}44` }}>
      <div style={{ textAlign: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 30, marginBottom: 6 }}>📈</div>
        <div style={{ fontSize: 16, fontWeight: 800, fontFamily: "'DM Serif Display',serif", color: C.text }}>Your Growth Since Day 0</div>
        <div style={{ fontSize: 12, color: C.muted, marginTop: 3 }}>Average: {avgBefore.toFixed(1)} → <span style={{ color: C.accent, fontWeight: 700 }}>{avgNow.toFixed(1)}</span> {avgNow > avgBefore ? `(+${(avgNow - avgBefore).toFixed(1)})` : ""}</div>
      </div>

      {BASELINE_QUESTIONS.map(bq => {
        const before = BASELINE_DAY0[bq.id];
        const now = answers[bq.id];
        const delta = now - before;
        return (
          <div key={bq.id} style={{ marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6, gap: 10 }}>
              <span style={{ fontSize: 12, color: C.text, fontWeight: 600, lineHeight: 1.4, flex: 1 }}>{bq.text}</span>
              <span style={{ fontSize: 11, fontWeight: 800, color: delta > 0 ? C.accent : delta < 0 ? C.rose : C.muted, flexShrink: 0 }}>
                {delta > 0 ? `+${delta}` : delta}
              </span>
            </div>
            {/* Before */}
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
              <span style={{ fontSize: 9, color: C.muted, width: 38, flexShrink: 0 }}>Day 0</span>
              <div style={{ flex: 1, height: 6, background: C.subtle, borderRadius: 3 }}>
                <div style={{ width: `${(before / 5) * 100}%`, height: "100%", background: C.muted + "77", borderRadius: 3 }} />
              </div>
              <span style={{ fontSize: 10, color: C.muted, width: 14, textAlign: "right" }}>{before}</span>
            </div>
            {/* Now */}
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 9, color: C.purple, fontWeight: 700, width: 38, flexShrink: 0 }}>Day 45</span>
              <div style={{ flex: 1, height: 6, background: C.subtle, borderRadius: 3 }}>
                <div style={{ width: `${(now / 5) * 100}%`, height: "100%", background: `linear-gradient(90deg,${C.purple},${C.accent})`, borderRadius: 3 }} />
              </div>
              <span style={{ fontSize: 10, color: C.purple, fontWeight: 700, width: 14, textAlign: "right" }}>{now}</span>
            </div>
          </div>
        );
      })}

      <div style={{ padding: "10px 13px", background: C.accentSoft, borderRadius: 10, border: `1px solid ${C.accentLight}44`, marginTop: 4 }}>
        <div style={{ fontSize: 10, fontWeight: 700, color: C.accent, marginBottom: 4 }}>✦ WHAT THIS MEANS</div>
        <div style={{ fontSize: 12, color: C.textSoft, lineHeight: 1.6 }}>
          Your results are shared with your trainer and manager to focus coaching where it matters. Next check-in: Day 90.
        </div>
      </div>
    </Card>
  );
}

}

                        <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{trainee?.name} · Due Day {a.dueDay}</div>
                      </div>
                      <div style={{ display: "flex", gap: 6 }}>
                        <Tag color={statusColor}>{a.status}</Tag>
                        <button onClick={() => setActiveAsgn(isOpen ? null : a.id)}
                          style={{ background: C.subtle, border: `1px solid ${C.border}`, borderRadius: 7, padding: "3px 8px", fontSize: 12, cursor: "pointer", color: C.muted }}>
                          {isOpen ? "▲" : "▼"}
                        </button>
                      </div>
                    </div>
                    {a.status === "submitted" && !isOpen && (
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <StarRating value={ratings[a.id] || a.trainerRating || 0} />
                        <span style={{ fontSize: 11, color: C.muted }}>Rated</span>
                      </div>
                    )}
                    {isOpen && (
                      <div>
                        {a.status === "submitted" ? (
                          <div>
                            <div style={{ padding: "10px 12px", background: C.accentSoft, borderRadius: 10, border: `1px solid ${C.accentLight}44`, marginBottom: 10, fontSize: 12, color: C.textSoft }}>
                              <div style={{ fontWeight: 700, color: C.accent, marginBottom: 4 }}>📎 Submitted Day {a.submittedDay}</div>
                              <div>[{a.type === "audio" ? "🎙 Audio" : a.type === "document" ? "📄 Document" : "🖼 Image"} attached]</div>
                            </div>
                            <StarRating value={ratings[a.id] || a.trainerRating || 0} onChange={v => setRatings({ ...ratings, [a.id]: v })} />
                            <textarea value={ratingNotes[a.id] ?? a.trainerNote} onChange={e => setRatingNotes({ ...ratingNotes, [a.id]: e.target.value })} rows={2}
                              placeholder="Feedback note…" style={{ width: "100%", background: C.subtle, border: `1px solid ${C.border}`, borderRadius: 9, padding: "9px 12px", fontSize: 12, color: C.text, outline: "none", resize: "none", fontFamily: "inherit", lineHeight: 1.6, marginTop: 8 }} />
                            <div style={{ marginTop: 8 }}><Btn small color={C.accent}>Save Feedback</Btn></div>
                          </div>
                        ) : (
                          <div style={{ padding: "10px 12px", background: a.status === "overdue" ? C.roseSoft : C.amberSoft, borderRadius: 10, fontSize: 12, color: a.status === "overdue" ? C.rose : C.amber, fontWeight: 600 }}>
                            {a.status === "overdue" ? "⛔ Overdue — send a reminder" : "⏳ Awaiting submission"}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </Card>
              );
            })}
          </div>
        )}

        {/* ── MESSAGES ── */}
        {tab === "messages" && <MessagingPanel role="trainer" userName="Shadi Obeidat" />}

        {/* ── REPORTS ── */}
        {tab === "reports" && (
          <div>
            <SectionHead label="Trainer Only" title="Reports" sub="Analytics visible only to you." />
            {WORKSHOPS.map(w => (
              <Card key={w.id} style={{ padding: "16px", marginBottom: 12 }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: C.text, marginBottom: 10 }}>{w.title}</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 12 }}>
                  {[{ l: "Score", v: `${w.score}%`, c: C.accent }, { l: "Growth", v: `+${w.trend}%`, c: C.accentMid }, { l: "Learners", v: w.attendees, c: C.teal }, { l: "Phase", v: `${w.phase}/4`, c: C.amber }].map((s, i) => (
                    <div key={i} style={{ padding: "10px 12px", background: C.subtle, borderRadius: 10 }}>
                      <div style={{ fontSize: 10, color: C.muted, fontWeight: 700, textTransform: "uppercase" }}>{s.l}</div>
                      <div style={{ fontSize: 20, fontWeight: 800, color: s.c, fontFamily: "'DM Serif Display',serif" }}>{s.v}</div>
                    </div>
                  ))}
                </div>
                <PBar pct={w.score} color={C.accent} />
                <div style={{ fontSize: 10, color: C.muted, marginTop: 4, textAlign: "right" }}>Behavioral adoption rate</div>
              </Card>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// SHARED MESSAGING PANEL
// ════════════════════════════════════════════════════════════════════════
function MessagingPanel({ role, userName }) {
  const [newMsg, setNewMsg] = useState("");
  const [sent, setSent] = useState(false);
  const myMessages = MESSAGES.filter(m => m.from === userName || m.to === userName || role === "trainer");

  return (
    <div>
      <SectionHead label="Inbox" title="Messages" sub="Direct messages, notifications, documents." />
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 16 }}>
        {myMessages.map(m => (
          <Card key={m.id} style={{ padding: "14px 15px", borderLeft: `3px solid ${m.fromRole === "trainer" ? C.accent : m.fromRole === "manager" ? C.amber : C.teal}` }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <Avatar initials={m.from.split(" ").map(w=>w[0]).join("")} color={m.fromRole === "trainer" ? C.accent : C.amber} size={28} />
                <div>
                  <div style={{ fontSize: 12, fontWeight: 700, color: C.text }}>{m.from}</div>
                  <div style={{ fontSize: 10, color: C.muted }}>→ {m.to}</div>
                </div>
              </div>
              <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                {!m.read && <div style={{ width: 7, height: 7, borderRadius: "50%", background: C.rose }} />}
                <span style={{ fontSize: 10, color: C.muted }}>{m.time}</span>
              </div>
            </div>
            <div style={{ fontSize: 13, color: C.textSoft, lineHeight: 1.6 }}>{m.text}</div>
          </Card>
        ))}
      </div>

      {/* Compose */}
      <Card style={{ padding: "16px", border: `1.5px solid ${C.accentLight}55` }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: C.accent, letterSpacing: "0.07em", marginBottom: 10 }}>SEND MESSAGE</div>
        <textarea value={newMsg} onChange={e => setNewMsg(e.target.value)} rows={3} placeholder="Write your message, reminder, or push note…"
          style={{ width: "100%", background: C.subtle, border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 12px", color: C.text, fontSize: 13, outline: "none", resize: "none", fontFamily: "inherit", lineHeight: 1.6, marginBottom: 8 }} />
        <div style={{ display: "flex", gap: 8 }}>
          <Btn small color={C.muted} outline>📎 Attach</Btn>
          <Btn small color={C.muted} outline>🔗 Link</Btn>
          <div style={{ flex: 1 }} />
          {sent ? (
            <div style={{ fontSize: 12, color: C.accent, fontWeight: 700, padding: "7px 13px" }}>✓ Sent!</div>
          ) : (
            <Btn small color={C.accent} onClick={() => { if (newMsg.trim()) { setSent(true); setNewMsg(""); setTimeout(() => setSent(false), 2500); } }}>Send</Btn>
          )}
        </div>
      </Card>
    </div>
  );
}

// MATERIALS TAB — proper component so hooks work correctly
// ════════════════════════════════════════════════════════════════════════
function MaterialsTab({ workshopId, ws }) {
  const mat = WORKSHOP_MATERIALS[workshopId];
  const [matSection, setMatSection]   = useState("outline");
  const [watchedVideos, setWatchedVideos]   = useState(() => mat?.videos.filter(v=>v.watched).map(v=>v.id) || []);
  const [doneExercises, setDoneExercises]   = useState(() => mat?.exercises.filter(e=>e.completed).map(e=>e.id) || []);
  const [expandedWeek, setExpandedWeek]     = useState(null);

  if (!mat) return (
    <div style={{ padding:"40px 16px", textAlign:"center", color:C.muted }}>
      <div style={{ fontSize:32, marginBottom:12 }}>📂</div>
      <div style={{ fontSize:14, fontWeight:600 }}>No materials uploaded yet.</div>
      <div style={{ fontSize:12, marginTop:4 }}>Your trainer will add content soon.</div>
    </div>
  );

  const totalVideos = mat.videos.length;
  const watchedCount = watchedVideos.length;
  const totalDocs = mat.documents.length;
  const totalEx = mat.exercises.length;
  const doneCount = doneExercises.length;
  const overallPct = Math.round(((watchedCount + doneCount) / (totalVideos + totalEx)) * 100);

  const matTabs = [
    { id:"outline",   icon:"📋", label:"Outline"   },
    { id:"videos",    icon:"🎬", label:"Videos"    },
    { id:"documents", icon:"📁", label:"Files"     },
    { id:"exercises", icon:"✏️",  label:"Exercises" },
  ];

  return (
    <div style={{ paddingBottom: 8 }}>
      {/* Header */}
      <div style={{ marginBottom:16 }}>
        <div style={{ fontSize:10, fontWeight:700, color:C.muted, letterSpacing:"0.1em", marginBottom:4 }}>WORKSHOP MATERIALS</div>
        <div style={{ fontSize:20, fontWeight:800, fontFamily:"'DM Serif Display',serif", color:C.text, marginBottom:3 }}>{ws.title}</div>
        <div style={{ fontSize:12, color:C.muted }}>Facilitator: {mat.facilitator}</div>
      </div>

      {/* Progress overview */}
      <Card style={{ padding:"16px", marginBottom:14 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
          <div style={{ fontSize:11, fontWeight:700, color:C.muted, letterSpacing:"0.07em" }}>OVERALL PROGRESS</div>
          <div style={{ fontSize:22, fontWeight:800, color:C.accent, fontFamily:"'DM Serif Display',serif" }}>{overallPct}%</div>
        </div>
        <PBar pct={overallPct} color={C.accent} h={8} />
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginTop:12 }}>
          {[
            { l:"Videos",    v:`${watchedCount}/${totalVideos}`, c:C.teal   },
            { l:"Files",     v:`${totalDocs}`,                   c:C.purple },
            { l:"Exercises", v:`${doneCount}/${totalEx}`,        c:C.amber  },
          ].map((s,i) => (
            <div key={i} style={{ padding:"10px 8px", background:C.subtle, borderRadius:10, textAlign:"center" }}>
              <div style={{ fontSize:9, color:C.muted, fontWeight:700, textTransform:"uppercase", marginBottom:4 }}>{s.l}</div>
              <div style={{ fontSize:16, fontWeight:800, color:s.c, fontFamily:"'DM Serif Display',serif" }}>{s.v}</div>
            </div>
          ))}
        </div>
      </Card>

      {/* Trainer note */}
      <Card style={{ padding:"14px 16px", marginBottom:14, borderLeft:`3px solid ${C.accent}` }}>
        <div style={{ fontSize:10, fontWeight:700, color:C.accent, letterSpacing:"0.07em", marginBottom:6 }}>📌 NOTE FROM YOUR TRAINER</div>
        <div style={{ fontSize:13, color:C.textSoft, lineHeight:1.7, fontStyle:"italic" }}>"{mat.facilitatorNote}"</div>
        <div style={{ fontSize:11, color:C.muted, marginTop:6 }}>— {mat.facilitator}</div>
      </Card>

      {/* Sub-tab switcher */}
      <div style={{ display:"flex", background:C.subtle, borderRadius:12, padding:4, marginBottom:16, gap:2 }}>
        {matTabs.map(t => (
          <button key={t.id} onClick={() => setMatSection(t.id)}
            style={{ flex:1, padding:"8px 4px", background:matSection===t.id?C.white:"transparent", border:"none", borderRadius:9, cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:2, boxShadow:matSection===t.id?C.shadow:"none" }}>
            <span style={{ fontSize:15 }}>{t.icon}</span>
            <span style={{ fontSize:9, fontWeight:700, color:matSection===t.id?C.accent:C.muted, letterSpacing:"0.05em" }}>{t.label}</span>
          </button>
        ))}
      </div>

      {/* ── OUTLINE ── */}
      {matSection === "outline" && (
        <div>
          {mat.outline.map((wk, i) => {
            const isOpen = expandedWeek === i;
            const phaseColor = [C.accent, C.teal, C.amber, C.purple, C.purple][i] || C.accent;
            return (
              <Card key={i} style={{ marginBottom:10, overflow:"hidden" }}>
                <button onClick={() => setExpandedWeek(isOpen ? null : i)}
                  style={{ width:"100%", padding:"14px 16px", background:"none", border:"none", cursor:"pointer", display:"flex", alignItems:"center", gap:12, textAlign:"left" }}>
                  <div style={{ width:36, height:36, borderRadius:10, background:`${phaseColor}15`, border:`1.5px solid ${phaseColor}33`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:13, fontWeight:800, color:phaseColor, flexShrink:0 }}>{i+1}</div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:11, fontWeight:700, color:C.muted, marginBottom:2 }}>{wk.week}</div>
                    <div style={{ fontSize:13, fontWeight:700, color:C.text, lineHeight:1.3 }}>{wk.title}</div>
                  </div>
                  <span style={{ color:C.muted, fontSize:14, flexShrink:0 }}>{isOpen ? "▲" : "▼"}</span>
                </button>
                {isOpen && (
                  <div style={{ padding:"0 16px 14px" }}>
                    <div style={{ height:1, background:C.border, marginBottom:12 }} />
                    {wk.topics.map((tp, j) => (
                      <div key={j} style={{ display:"flex", gap:10, marginBottom:8, alignItems:"flex-start" }}>
                        <div style={{ width:6, height:6, borderRadius:"50%", background:phaseColor, flexShrink:0, marginTop:5 }} />
                        <div style={{ fontSize:13, color:C.textSoft, lineHeight:1.55 }}>{tp}</div>
                      </div>
                    ))}
                  </div>
                )}
              </Card>
            );
          })}
        </div>
      )}

      {/* ── VIDEOS ── */}
      {matSection === "videos" && (
        <div>
          <div style={{ fontSize:11, fontWeight:700, color:C.muted, letterSpacing:"0.08em", marginBottom:10 }}>{watchedCount} OF {totalVideos} WATCHED</div>
          {mat.videos.map(v => {
            const watched = watchedVideos.includes(v.id);
            const phaseColor = PHASES[v.phase - 1]?.color || C.accent;
            return (
              <Card key={v.id} style={{ padding:"14px 15px", marginBottom:10, display:"flex", gap:14, alignItems:"center" }}>
                <div style={{ width:56, height:42, borderRadius:10, background:`${phaseColor}15`, border:`1.5px solid ${phaseColor}33`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:22, flexShrink:0, position:"relative" }}>
                  🎬
                  {watched && (
                    <div style={{ position:"absolute", inset:0, background:"rgba(26,122,74,0.75)", borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, color:"#fff" }}>✓</div>
                  )}
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:13, fontWeight:700, color:C.text, lineHeight:1.35 }}>{v.title}</div>
                  <div style={{ display:"flex", gap:8, marginTop:5, alignItems:"center", flexWrap:"wrap" }}>
                    <span style={{ fontSize:11, color:C.muted }}>⏱ {v.duration}</span>
                    <Tag color={phaseColor} small>Phase {v.phase}</Tag>
                  </div>
                </div>
                <button
                  onClick={() => setWatchedVideos(watched ? watchedVideos.filter(x => x !== v.id) : [...watchedVideos, v.id])}
                  style={{ width:36, height:36, borderRadius:"50%", background:watched?C.accentSoft2:C.subtle, border:`1.5px solid ${watched?C.accent:C.border}`, color:watched?C.accent:C.muted, fontSize:15, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                  {watched ? "✓" : "▶"}
                </button>
              </Card>
            );
          })}
        </div>
      )}

      {/* ── DOCUMENTS ── */}
      {matSection === "documents" && (
        <div>
          <div style={{ fontSize:11, fontWeight:700, color:C.muted, letterSpacing:"0.08em", marginBottom:10 }}>{totalDocs} FILES AVAILABLE</div>
          {mat.documents.map(d => {
            const phaseColor = PHASES[d.phase - 1]?.color || C.accent;
            const typeColor = d.type === "PDF" ? C.rose : d.type === "DOCX" ? C.teal : C.amber;
            return (
              <Card key={d.id} style={{ padding:"13px 15px", marginBottom:8, display:"flex", gap:12, alignItems:"center" }}>
                <div style={{ width:44, height:44, borderRadius:10, background:`${typeColor}12`, border:`1.5px solid ${typeColor}33`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, flexShrink:0 }}>{d.icon}</div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:13, fontWeight:700, color:C.text, lineHeight:1.3 }}>{d.title}</div>
                  <div style={{ display:"flex", gap:6, marginTop:5, alignItems:"center", flexWrap:"wrap" }}>
                    <Tag color={typeColor} small>{d.type}</Tag>
                    <span style={{ fontSize:10, color:C.muted }}>{d.size}</span>
                    <Tag color={phaseColor} small>Phase {d.phase}</Tag>
                  </div>
                </div>
                <button style={{ padding:"6px 12px", background:C.accentSoft2, border:`1px solid ${C.accentLight}55`, borderRadius:9, color:C.accent, fontSize:11, fontWeight:700, cursor:"pointer", flexShrink:0 }}>↓ Save</button>
              </Card>
            );
          })}
          <Card style={{ padding:"14px 16px", marginTop:6, display:"flex", gap:12, alignItems:"center", border:`1.5px solid ${C.teal}44`, background:C.tealSoft }}>
            <div style={{ fontSize:22 }}>🔗</div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:13, fontWeight:700, color:C.teal }}>Post-Evaluation Form</div>
              <div style={{ fontSize:11, color:C.muted, marginTop:2 }}>Complete your end-of-workshop assessment</div>
            </div>
            <button style={{ padding:"6px 12px", background:C.teal, border:"none", borderRadius:9, color:C.white, fontSize:11, fontWeight:700, cursor:"pointer" }}>Open →</button>
          </Card>
        </div>
      )}

      {/* ── EXERCISES ── */}
      {matSection === "exercises" && (
        <div>
          <div style={{ fontSize:11, fontWeight:700, color:C.muted, letterSpacing:"0.08em", marginBottom:10 }}>{doneCount} OF {totalEx} COMPLETED</div>
          {mat.exercises.map(ex => {
            const done = doneExercises.includes(ex.id);
            const phaseColor = PHASES[ex.phase - 1]?.color || C.accent;
            return (
              <Card key={ex.id} style={{ padding:"15px", marginBottom:10, borderLeft:`3px solid ${done ? C.accent : C.border}` }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8 }}>
                  <div style={{ flex:1, paddingRight:10 }}>
                    <div style={{ fontSize:13, fontWeight:700, color:C.text, lineHeight:1.35, marginBottom:4 }}>{ex.title}</div>
                    <Tag color={phaseColor} small>Phase {ex.phase}</Tag>
                  </div>
                  <button
                    onClick={() => setDoneExercises(done ? doneExercises.filter(x => x !== ex.id) : [...doneExercises, ex.id])}
                    style={{ width:32, height:32, borderRadius:"50%", background:done?C.accentSoft2:C.subtle, border:`1.5px solid ${done?C.accent:C.border}`, color:done?C.accent:C.muted, fontSize:14, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                    {done ? "✓" : "○"}
                  </button>
                </div>
                <div style={{ fontSize:12, color:C.textSoft, lineHeight:1.6, marginBottom: done ? 0 : 10 }}>{ex.desc}</div>
                {!done && (
                  <div style={{ display:"flex", gap:6 }}>
                    <Btn small color={C.accent}>📎 Submit Work</Btn>
                    <Btn small color={C.teal}>🎙 Voice Note</Btn>
                  </div>
                )}
                {done && <div style={{ fontSize:11, color:C.accent, fontWeight:700, marginTop:6 }}>✓ Marked complete</div>}
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

// JOURNEY DETAIL VIEW — tabbed inner screen for trainee & trainer
// ════════════════════════════════════════════════════════════════════════
function JourneyDetailView({ j, ws, ss, jTabs, objectives, setObjectives, quizAnswers, setQuizAnswers, quizDone, setQuizDone, myAssignments, me, onBack, role = "trainee" }) {
  const [innerTab, setInnerTab] = useState("overview");
  const [newMsg, setNewMsg] = useState("");
  const [sentMsg, setSentMsg] = useState(false);
  const [trRatings, setTrRatings] = useState({});
  const [localMsgs, setLocalMsgs] = useState(MESSAGES.filter(m => m.to === (me?.name || "") || m.from === (me?.name || "")));
  const jAssignments = (myAssignments || ASSIGNMENTS).filter(a => {
    const t = TEAM.find(x => x.id === a.traineeId);
    return t?.workshopId === j.workshopId;
  });
  const isTrainer = role === "trainer";

  const sendMsg = () => {
    if (!newMsg.trim()) return;
    const msg = { id: `m_${Date.now()}`, from: me?.name || "Shadi Obeidat", fromRole: role, to: isTrainer ? "Ahmad Khalil" : "Shadi Obeidat", text: newMsg.trim(), time: "Just now", read: false };
    setLocalMsgs([...localMsgs, msg]);
    setNewMsg(""); setSentMsg(true);
    setTimeout(() => setSentMsg(false), 2000);
  };

  return (
    <div style={{ paddingBottom: 100 }}>
      {/* ── Sticky back + title header ── */}
      <div style={{ position: "sticky", top: 54, zIndex: 90, background: C.white, borderBottom: `1px solid ${C.border}` }}>
        <div style={{ padding: "12px 16px", display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={onBack}
            style={{ width: 34, height: 34, borderRadius: "50%", background: C.subtle, border: `1px solid ${C.border}`, color: C.muted, fontSize: 18, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>←</button>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 9, fontWeight: 700, color: j.color, letterSpacing: "0.09em", textTransform: "uppercase" }}>Journey {j.number}</div>
            <div style={{ fontSize: 14, fontWeight: 800, fontFamily: "'DM Serif Display',serif", color: C.text, lineHeight: 1.2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{j.title}</div>
          </div>
          <div style={{ padding: "4px 10px", background: ss.bg, borderRadius: 20, fontSize: 10, fontWeight: 700, color: ss.color, flexShrink: 0 }}>{ss.label}</div>
        </div>

        {/* ── Inner tab bar ── */}
        <div style={{ display: "flex", overflowX: "auto", borderTop: `1px solid ${C.border}` }}>
          {jTabs.map(t => (
            <button key={t.id} onClick={() => setInnerTab(t.id)}
              style={{ padding: "10px 14px", background: "none", border: "none", borderBottom: `2.5px solid ${innerTab === t.id ? j.color : "transparent"}`, color: innerTab === t.id ? j.color : C.muted, fontSize: 12, fontWeight: 700, cursor: "pointer", flexShrink: 0, display: "flex", alignItems: "center", gap: 5, whiteSpace: "nowrap" }}>
              <span style={{ fontSize: 13 }}>{t.icon}</span>{t.label}
            </button>
          ))}
        </div>
      </div>

      <div style={{ padding: "18px 16px" }}>

        {/* ══ OVERVIEW ══ */}
        {innerTab === "overview" && (
          <div>
            {/* Day 45 check-in (trainee, active journey only) */}
            {!isTrainer && j.status === "active" && <BaselineCheckIn journeyColor={j.color} />}
