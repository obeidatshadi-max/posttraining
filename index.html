            <Card style={{ padding: "16px", marginBottom: 14, borderTop: `3px solid ${j.color}` }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                <div>
                  <div style={{ fontSize: 12, color: C.muted }}>{j.subtitle}</div>
                  <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>📅 {j.startDate} – {j.endDate}</div>
                  <div style={{ fontSize: 11, color: C.muted, marginTop: 1 }}>🎓 {j.facilitator}</div>
                </div>
              </div>

              {j.status === "active" && (
                <>
                  <div style={{ display: "flex", gap: 5, marginBottom: 5 }}>
                    {PHASES.map((p, i) => (
                      <div key={i} style={{ flex: 1, height: 5, borderRadius: 3, background: i < j.phase ? p.color : C.border, opacity: i + 1 === j.phase ? 1 : i < j.phase ? 0.55 : 0.2 }} />
                    ))}
                  </div>
                  <div style={{ fontSize: 10, color: C.muted, marginBottom: 12 }}>Phase {j.phase}/4 · Day {j.day}/{j.total}</div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
                    {[{ l: "Day", v: `${j.day}/${j.total}`, c: j.color }, { l: "Score", v: `${j.score}%`, c: C.teal }, { l: "Streak", v: `🔥 ${j.streak}d`, c: C.amber }].map((s, i) => (
                      <div key={i} style={{ padding: "9px 8px", background: C.subtle, borderRadius: 10, textAlign: "center" }}>
                        <div style={{ fontSize: 9, color: C.muted, fontWeight: 700, textTransform: "uppercase", marginBottom: 3 }}>{s.l}</div>
                        <div style={{ fontSize: 14, fontWeight: 800, color: s.c, fontFamily: "'DM Serif Display',serif" }}>{s.v}</div>
                      </div>
                    ))}
                  </div>
                </>
              )}
              {j.status !== "active" && (
                <div style={{ padding: "11px 14px", background: C.subtle, borderRadius: 10, fontSize: 13, color: C.muted, textAlign: "center" }}>
                  {j.status === "upcoming" ? `🗓 Starts ${j.startDate} — unlocks soon` : `📅 Planned for ${j.startDate}`}
                </div>
              )}
            </Card>

            {/* About + outcomes */}
            <Card style={{ padding: "16px", marginBottom: 14 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: "0.07em", marginBottom: 8 }}>ABOUT THIS JOURNEY</div>
              <div style={{ fontSize: 13, color: C.textSoft, lineHeight: 1.7, marginBottom: 14 }}>{j.description}</div>
              <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: "0.07em", marginBottom: 8 }}>BEHAVIORAL OUTCOMES</div>
              {j.outcomes.map((o, i) => (
                <div key={i} style={{ display: "flex", gap: 9, marginBottom: 8, alignItems: "flex-start" }}>
                  <div style={{ width: 20, height: 20, borderRadius: "50%", background: `${j.color}15`, border: `1.5px solid ${j.color}33`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 800, color: j.color, flexShrink: 0, marginTop: 1 }}>{i + 1}</div>
                  <div style={{ fontSize: 13, color: C.textSoft, lineHeight: 1.55 }}>{o}</div>
                </div>
              ))}
              {j.evalLink && (
                <div style={{ marginTop: 12, padding: "10px 12px", background: C.tealSoft, borderRadius: 10, border: `1px solid ${C.teal}33`, display: "flex", alignItems: "center", gap: 8 }}>
                  <span>🔗</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: C.teal }}>Post-Evaluation Form</div>
                  </div>
                  <button style={{ padding: "5px 11px", background: C.teal, border: "none", borderRadius: 8, color: C.white, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>Open</button>
                </div>
              )}
            </Card>

            {/* Personal objectives (trainee only) */}
            {!isTrainer && j.status === "active" && (
              <div>
                <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: "0.08em", marginBottom: 10 }}>MY PERSONAL OBJECTIVES</div>
                {(objectives || []).map(o => {
                  const pc = o.progress >= 75 ? C.accent : o.progress >= 40 ? C.teal : C.amber;
                  return (
                    <Card key={o.id} style={{ padding: "14px 15px", marginBottom: 10 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                        <div style={{ fontSize: 13, color: C.text, flex: 1, paddingRight: 10, lineHeight: 1.55 }}>{o.text}</div>
                        <div style={{ fontSize: 18, fontWeight: 800, color: pc, fontFamily: "'DM Serif Display',serif", flexShrink: 0 }}>{o.progress}%</div>
                      </div>
                      <PBar pct={o.progress} color={pc} />
                      <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                        <button onClick={() => setObjectives(objectives.map(x => x.id === o.id ? { ...x, progress: Math.max(0, x.progress - 10) } : x))}
                          style={{ width: 30, height: 30, borderRadius: 8, background: C.subtle, border: `1px solid ${C.border}`, color: C.muted, fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
                        <button onClick={() => setObjectives(objectives.map(x => x.id === o.id ? { ...x, progress: Math.min(100, x.progress + 10) } : x))}
                          style={{ width: 30, height: 30, borderRadius: 8, background: C.accentSoft2, border: `1px solid ${C.accentLight}44`, color: C.accent, fontSize: 16, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>＋</button>
                        <div style={{ fontSize: 11, color: C.muted, flex: 1, alignSelf: "center", fontStyle: "italic" }}>{o.note}</div>
                      </div>
                    </Card>
                  );
                })}
              </div>
            )}

            {/* Trainer learner overview */}
            {isTrainer && (
              <div>
                <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: "0.08em", marginBottom: 10 }}>LEARNER PROGRESS</div>
                {TEAM.filter(t => t.workshopId === j.workshopId).map(t => {
                  const sc = t.score > 80 ? C.accent : t.score > 60 ? C.teal : C.amber;
                  return (
                    <Card key={t.id} style={{ padding: "13px 15px", marginBottom: 8, display: "flex", alignItems: "center", gap: 12 }}>
                      <Ring pct={t.score} color={sc} size={42} stroke={4} label={t.avatar} />
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 13, fontWeight: 700, color: C.text }}>{t.name}</div>
                        <div style={{ fontSize: 11, color: C.muted }}>{t.role} · 🔥 {t.streak}d</div>
                      </div>
                      <Tag color={sc}>{t.score}%</Tag>
                    </Card>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* ══ MATERIALS ══ */}
        {innerTab === "materials" && (
          <div>
            {j.status === "active" && ws
              ? <MaterialsTab workshopId={j.workshopId} ws={ws} />
              : (
                <div style={{ padding: "40px 20px", textAlign: "center" }}>
                  <div style={{ fontSize: 36, marginBottom: 12 }}>🔒</div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: C.text, marginBottom: 6 }}>Materials locked</div>
                  <div style={{ fontSize: 13, color: C.muted }}>Materials will be available when this journey becomes active on {j.startDate}.</div>
                </div>
              )
            }
          </div>
        )}

        {/* ══ ASSIGNMENTS ══ */}
        {innerTab === "assignments" && (
          <div>
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: C.muted, letterSpacing: "0.1em", marginBottom: 2 }}>
                {isTrainer ? "TRAINER VIEW" : "TRAINEE VIEW"}
              </div>
              <div style={{ fontSize: 18, fontWeight: 800, fontFamily: "'DM Serif Display',serif", color: C.text }}>
                {isTrainer ? "Review Assignments" : "My Assignments"}
              </div>
              <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>
                {isTrainer ? "Rate submissions and give feedback." : "Submit your work and track trainer feedback."}
              </div>
            </div>

            {jAssignments.length === 0 && (
              <Card style={{ padding: "28px", textAlign: "center" }}>
                <div style={{ fontSize: 28, marginBottom: 8 }}>📋</div>
                <div style={{ fontSize: 13, color: C.muted }}>No assignments yet for this journey.</div>
              </Card>
            )}

            {jAssignments.map(a => {
              const statusColor = a.status === "submitted" ? C.accent : a.status === "overdue" ? C.rose : C.amber;
              const trainee = TEAM.find(t => t.id === a.traineeId);
              return (
                <Card key={a.id} style={{ padding: "15px", marginBottom: 10, overflow: "hidden" }}>
                  <div style={{ height: 3, background: statusColor, margin: "-15px -15px 12px" }} />

                  {isTrainer && (
                    <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
                      <Avatar initials={trainee?.avatar || "??"} color={C.accent} size={26} />
                      <span style={{ fontSize: 12, fontWeight: 700, color: C.text }}>{trainee?.name}</span>
                    </div>
                  )}

                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                    <div style={{ flex: 1, paddingRight: 10 }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: C.text }}>{a.title}</div>
                      <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>Due: Day {a.dueDay} · {a.type}</div>
                    </div>
                    <Tag color={statusColor}>{a.status}</Tag>
                  </div>

                  {/* Submitted state */}
                  {a.status === "submitted" && (
                    <div style={{ padding: "10px 12px", background: C.accentSoft, borderRadius: 10, border: `1px solid ${C.accentLight}44`, marginBottom: isTrainer ? 10 : 0 }}>
                      <div style={{ fontSize: 10, fontWeight: 700, color: C.accent, marginBottom: 4 }}>
                        {isTrainer ? "📎 SUBMITTED WORK" : "TRAINER FEEDBACK"}
                      </div>
                      {!isTrainer && a.trainerRating && (
                        <>
                          <StarRating value={a.trainerRating} />
                          <div style={{ fontSize: 12, color: C.textSoft, marginTop: 5, lineHeight: 1.55 }}>{a.trainerNote}</div>
                        </>
                      )}
                      {isTrainer && (
                        <div style={{ fontSize: 12, color: C.textSoft }}>
                          [{a.type === "audio" ? "🎙 Audio recording" : a.type === "document" ? "📄 Document" : "🖼 Image"} — submitted Day {a.submittedDay}]
                        </div>
                      )}
                    </div>
                  )}

                  {/* Trainer rating area */}
                  {isTrainer && a.status === "submitted" && (
                    <div style={{ marginTop: 10 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, marginBottom: 6 }}>YOUR RATING</div>
                      <StarRating value={trRatings[a.id] ?? a.trainerRating ?? 0} onChange={v => setTrRatings({ ...trRatings, [a.id]: v })} />
                      <div style={{ marginTop: 8, padding: "8px 12px", background: C.subtle, borderRadius: 8, fontSize: 12, color: C.textSoft, fontStyle: "italic" }}>{a.trainerNote || "No feedback added yet."}</div>
                    </div>
                  )}

                  {/* Trainee submit area */}
                  {!isTrainer && a.status !== "submitted" && (
                    <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                      <Btn small color={C.accent}>📎 Upload</Btn>
                      <Btn small color={C.teal}>🎙 Voice</Btn>
                      <Btn small color={C.purple}>📷 Image</Btn>
                    </div>
                  )}

                  {/* Overdue alert */}
                  {a.status === "overdue" && (
                    <div style={{ marginTop: 8, padding: "8px 12px", background: C.roseSoft, borderRadius: 8, fontSize: 12, color: C.rose, fontWeight: 600 }}>
                      ⛔ Overdue — {isTrainer ? "send a reminder" : "submit as soon as possible"}
                    </div>
                  )}
                </Card>
              );
            })}

            {/* Trainer: add new assignment */}
            {isTrainer && (
              <Card style={{ padding: "16px", border: `1.5px dashed ${C.accent}55`, background: C.accentSoft, marginTop: 4 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: C.accent, marginBottom: 8 }}>+ CREATE NEW ASSIGNMENT</div>
                <input placeholder="Assignment title…"
                  style={{ width: "100%", background: C.white, border: `1px solid ${C.border}`, borderRadius: 9, padding: "10px 12px", color: C.text, fontSize: 13, outline: "none", marginBottom: 8, fontFamily: "inherit" }} />
                <div style={{ display: "flex", gap: 8 }}>
                  <Btn small color={C.accent}>Create</Btn>
                  <Btn small color={C.teal} outline>Attach File</Btn>
                </div>
              </Card>
            )}
          </div>
        )}

        {/* ══ QUIZ ══ */}
        {innerTab === "quiz" && (
          <div>
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: C.muted, letterSpacing: "0.1em", marginBottom: 2 }}>
                {isTrainer ? "TRAINER VIEW" : "FROM TRAINER"}
              </div>
              <div style={{ fontSize: 18, fontWeight: 800, fontFamily: "'DM Serif Display',serif", color: C.text }}>
                {isTrainer ? "Quiz Management" : "Active Quiz"}
              </div>
              <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>
                {isTrainer ? "Send quizzes and view results." : `${j.title} · Complete before Day 52`}
              </div>
            </div>

            {/* Trainer view: sent quiz + create new */}
            {isTrainer && (
              <div>
                <Card style={{ padding: "15px", marginBottom: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: C.text }}>SPIN Selling — Quick Check</div>
                    <Tag color={C.accent}>Sent · Day 45</Tag>
                  </div>
                  <div style={{ fontSize: 12, color: C.muted, marginBottom: 10 }}>3 questions · 15 of 18 completed</div>
                  <PBar pct={83} color={C.accent} />
                  <div style={{ fontSize: 10, color: C.muted, marginTop: 4 }}>15/18 submitted</div>
                </Card>
                <Card style={{ padding: "16px", border: `1.5px dashed ${C.accent}55`, background: C.accentSoft }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: C.accent, marginBottom: 10 }}>+ SEND NEW QUIZ</div>
                  {QUIZ_QUESTIONS.map((q, i) => (
                    <div key={q.id} style={{ padding: "10px 12px", background: C.white, border: `1px solid ${C.border}`, borderRadius: 10, marginBottom: 8 }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: C.text, marginBottom: 4 }}>{i+1}. {q.q}</div>
                      {q.options.map((opt, j) => (
                        <div key={j} style={{ fontSize: 11, color: j === q.correct ? C.accent : C.muted, padding: "3px 0", fontWeight: j === q.correct ? 700 : 400 }}>
                          {j === q.correct ? "✓ " : "○ "}{opt}
                        </div>
                      ))}
                    </div>
                  ))}
                  <Btn full color={C.accent}>Send to All Learners</Btn>
                </Card>
              </div>
            )}

            {/* Trainee view: answer quiz */}
            {!isTrainer && (
              <div>
                {!quizDone ? (
                  <div>
                    {QUIZ_QUESTIONS.map((q, i) => (
                      <Card key={q.id} style={{ padding: "15px", marginBottom: 12 }}>
                        <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 10 }}>{i+1}. {q.q}</div>
                        {q.options.map((opt, k) => (
                          <button key={k} onClick={() => setQuizAnswers({ ...quizAnswers, [q.id]: k })}
                            style={{ width: "100%", padding: "10px 12px", background: quizAnswers[q.id] === k ? C.accentSoft2 : C.subtle, border: `1.5px solid ${quizAnswers[q.id] === k ? C.accent : C.border}`, borderRadius: 10, textAlign: "left", cursor: "pointer", fontSize: 12, color: quizAnswers[q.id] === k ? C.accent : C.textSoft, fontWeight: quizAnswers[q.id] === k ? 700 : 400, marginBottom: 6 }}>
                            {opt}
                          </button>
                        ))}
                      </Card>
                    ))}
                    <Btn full onClick={() => Object.keys(quizAnswers).length === QUIZ_QUESTIONS.length && setQuizDone(true)}>
                      Submit Quiz
                    </Btn>
                  </div>
                ) : (
                  <Card style={{ padding: "32px", textAlign: "center" }}>
                    <div style={{ fontSize: 44, marginBottom: 12 }}>✅</div>
                    <div style={{ fontSize: 18, fontWeight: 700, color: C.accent, fontFamily: "'DM Serif Display',serif", marginBottom: 6 }}>Quiz Submitted!</div>
                    <div style={{ fontSize: 13, color: C.muted }}>Your trainer will review and respond shortly.</div>
                  </Card>
                )}
              </div>
            )}
          </div>
        )}

        {/* ══ MESSAGES ══ */}
        {innerTab === "messages" && (
          <div>
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: C.muted, letterSpacing: "0.1em", marginBottom: 2 }}>JOURNEY MESSAGES</div>
              <div style={{ fontSize: 18, fontWeight: 800, fontFamily: "'DM Serif Display',serif", color: C.text }}>{j.title}</div>
              <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>
                {isTrainer ? "Messages with learners in this journey." : "Direct channel with your trainer & manager."}
              </div>
            </div>

            {/* Message thread */}
            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 16 }}>
              {localMsgs.map(m => {
                const isMine = m.from === (me?.name || "");
                const roleColor = m.fromRole === "trainer" ? C.accent : m.fromRole === "manager" ? C.amber : C.teal;
                return (
                  <div key={m.id} style={{ display: "flex", justifyContent: isMine ? "flex-end" : "flex-start", gap: 8, alignItems: "flex-end" }}>
                    {!isMine && (
                      <Avatar initials={m.from.split(" ").map(w=>w[0]).join("")} color={roleColor} size={28} />
                    )}
                    <div style={{ maxWidth: "78%" }}>
                      {!isMine && <div style={{ fontSize: 10, fontWeight: 700, color: roleColor, marginBottom: 3 }}>{m.from}</div>}
                      <div style={{
                        padding: "11px 14px",
                        borderRadius: isMine ? "16px 16px 4px 16px" : "16px 16px 16px 4px",
                        background: isMine ? `linear-gradient(135deg,${C.accent},${C.accentMid})` : C.white,
                        border: isMine ? "none" : `1px solid ${C.border}`,
                        fontSize: 13, lineHeight: 1.6,
                        color: isMine ? C.white : C.text,
                        boxShadow: C.shadow,
                      }}>{m.text}</div>
                      <div style={{ fontSize: 10, color: C.muted, marginTop: 3, textAlign: isMine ? "right" : "left" }}>{m.time}</div>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Compose */}
            <Card style={{ padding: "14px", border: `1.5px solid ${C.border}`, position: "sticky", bottom: 80 }}>
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <Btn small color={C.muted} outline>📎</Btn>
                <Btn small color={C.muted} outline>🔗</Btn>
                <Btn small color={C.muted} outline>🎙</Btn>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={newMsg} onChange={e => setNewMsg(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && sendMsg()}
                  placeholder={isTrainer ? "Message to learners…" : "Message your trainer…"}
                  style={{ flex: 1, background: C.subtle, border: `1px solid ${C.border}`, borderRadius: 24, padding: "10px 16px", color: C.text, fontSize: 13, outline: "none", fontFamily: "inherit" }} />
                {sentMsg
                  ? <div style={{ width: 40, height: 40, borderRadius: "50%", background: C.accentSoft2, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, color: C.accent }}>✓</div>
                  : <button onClick={sendMsg} style={{ width: 40, height: 40, borderRadius: "50%", background: `linear-gradient(135deg,${C.accent},${C.accentMid})`, border: "none", color: C.white, fontSize: 18, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>↑</button>
                }
              </div>
            </Card>
          </div>
        )}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════
// TRAINEE SECTION
// ════════════════════════════════════════════════════════════════════════
function TraineeSection() {
  const [tab, setTab] = useState("journeys");
  const [selectedJourney, setSelectedJourney] = useState(null); // null = list view
  const me = TEAM[0]; // Ahmad Khalil
  const myMessages = MESSAGES.filter(m => m.to === me.name);
  const myAssignments = ASSIGNMENTS.filter(a => a.traineeId === me.id);
  const [objectives, setObjectives] = useState([
    { id: 1, text: "Stop rushing through Implication stage — set a mental timer", progress: 40, note: "Still struggling under time pressure" },
    { id: 2, text: "Ask Situation questions confidently even with specialists", progress: 65, note: "Getting better" },
  ]);
  const [quizAnswers, setQuizAnswers] = useState({});
  const [quizDone, setQuizDone] = useState(false);

  // The workshop corresponding to the selected journey (for MaterialsTab)
  const activeJourneyData = selectedJourney ? JOURNEYS.find(j => j.id === selectedJourney) : null;
  const activeWs = activeJourneyData ? WORKSHOPS.find(w => w.id === activeJourneyData.workshopId) : null;

  const tabs = [{ id: "journeys", l: "My Journeys" }];
  const sc = me.score > 80 ? C.accent : me.score > 60 ? C.teal : C.amber;

  const statusStyle = {
    active:    { color: C.accent,  bg: C.accentSoft2, label: "Active"    },
    upcoming:  { color: C.teal,    bg: C.tealSoft,    label: "Upcoming"  },
    planned:   { color: C.muted,   bg: C.subtle,      label: "Planned"   },
    completed: { color: C.purple,  bg: C.purpleSoft,  label: "Completed" },
  };

  // ── Journey detail view (full tabbed) ────────────────────────────────
  if (selectedJourney && tab === "journeys") {
    const j = JOURNEYS.find(x => x.id === selectedJourney);
    const ws = WORKSHOPS.find(w => w.id === j.workshopId);
    const ss = statusStyle[j.status];
    const jTabs = [
      { id: "overview",    icon: "◎",  label: "Overview"    },
      { id: "materials",   icon: "📁", label: "Materials"   },
      { id: "assignments", icon: "📋", label: "Assignments" },
      { id: "quiz",        icon: "📝", label: "Quiz"        },
      { id: "messages",    icon: "💬", label: "Messages"    },
    ];

    return (
      <JourneyDetailView
        j={j} ws={ws} ss={ss} jTabs={jTabs}
        objectives={objectives} setObjectives={setObjectives}
        quizAnswers={quizAnswers} setQuizAnswers={setQuizAnswers}
        quizDone={quizDone} setQuizDone={setQuizDone}
        myAssignments={myAssignments} me={me}
        onBack={() => setSelectedJourney(null)}
      />
    );
  }

  // ── Main trainee view ─────────────────────────────────────────────────
  return (
    <div style={{ paddingBottom: 100 }}>
      <div style={{ padding: "18px 16px 0", background: C.white, borderBottom: `1px solid ${C.border}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
          <Ring pct={me.score} color={sc} size={44} stroke={4} label={me.avatar} />
          <div>
            <div style={{ fontSize: 15, fontWeight: 800, color: C.text, fontFamily: "'DM Serif Display',serif" }}>{me.name}</div>
            <div style={{ fontSize: 11, color: C.accentMid }}>{me.role} · 🔥 {me.streak}-day streak</div>
          </div>
          {myMessages.filter(m => !m.read).length > 0 && (
            <div style={{ marginLeft: "auto", width: 22, height: 22, borderRadius: "50%", background: C.rose, color: C.white, fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{myMessages.filter(m => !m.read).length}</div>
          )}
        </div>
        <div style={{ display: "flex", gap: 0, overflowX: "auto" }}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              style={{ padding: "9px 13px", background: "none", border: "none", borderBottom: `2.5px solid ${tab === t.id ? C.teal : "transparent"}`, color: tab === t.id ? C.teal : C.muted, fontSize: 12, fontWeight: 700, cursor: "pointer", flexShrink: 0 }}>
              {t.l}
            </button>
          ))}
        </div>
      </div>

      <div style={{ padding: "18px 16px" }}>

        {/* ── JOURNEYS LIST ── */}
        {tab === "journeys" && (
          <div>
            <div style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: C.muted, letterSpacing: "0.1em", marginBottom: 3 }}>MY LEARNING PATH</div>
              <div style={{ fontSize: 20, fontWeight: 800, fontFamily: "'DM Serif Display',serif", color: C.text }}>Training Journeys</div>
              <div style={{ fontSize: 13, color: C.muted, marginTop: 3 }}>Each journey is a 90-day behavioral transformation.</div>
            </div>

            {/* Overall path progress */}
            <Card style={{ padding: "16px", marginBottom: 18, background: `linear-gradient(135deg, ${C.accentSoft} 0%, ${C.white} 100%)`, border: `1.5px solid ${C.accentLight}55` }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: "0.07em", marginBottom: 10 }}>OVERALL LEARNING PATH</div>
              <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                {JOURNEYS.map((j, i) => {
                  const ss = statusStyle[j.status];
                  return (
                    <div key={j.id} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                      <div style={{ width: "100%", height: 8, borderRadius: 4, background: j.status === "active" ? `linear-gradient(90deg,${j.color},${j.color}88)` : j.status === "planned" || j.status === "upcoming" ? C.border : j.color, position: "relative", overflow: j.status === "active" ? "hidden" : "visible" }}>
                        {j.status === "active" && (
                          <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${Math.round((j.day/j.total)*100)}%`, background: j.color, borderRadius: 4 }} />
                        )}
                      </div>
                      <div style={{ fontSize: 9, fontWeight: 700, color: ss.color, textTransform: "uppercase", letterSpacing: "0.04em" }}>J{j.number}</div>
                    </div>
                  );
                })}
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8 }}>
                <span style={{ fontSize: 11, color: C.muted }}>1 active · 1 upcoming · 1 planned</span>
                <span style={{ fontSize: 11, fontWeight: 700, color: C.accent }}>Journey 1 of 3</span>
              </div>
            </Card>

            {/* Journey cards */}
            {JOURNEYS.map(j => {
              const ss = statusStyle[j.status];
              const isActive = j.status === "active";
              return (
                <button key={j.id} onClick={() => { setSelectedJourney(j.id); setTab("journeys"); }}
                  style={{ width: "100%", marginBottom: 12, padding: 0, background: "none", border: "none", cursor: "pointer", textAlign: "left" }}>
                  <Card style={{ padding: "17px 16px", borderLeft: `4px solid ${j.color}`, position: "relative", overflow: "hidden" }}>
                    {/* Journey number badge */}
                    <div style={{ position: "absolute", top: 14, right: 14, width: 28, height: 28, borderRadius: "50%", background: `${j.color}15`, border: `1.5px solid ${j.color}33`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, color: j.color }}>{j.number}</div>

                    <div style={{ display: "flex", gap: 12, alignItems: "flex-start", marginBottom: 12 }}>
                      <div style={{ width: 42, height: 42, borderRadius: 12, background: `${j.color}12`, border: `1.5px solid ${j.color}33`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, flexShrink: 0 }}>{j.icon}</div>
                      <div style={{ flex: 1, paddingRight: 36 }}>
                        <div style={{ fontSize: 10, fontWeight: 700, color: j.color, letterSpacing: "0.07em", marginBottom: 2 }}>JOURNEY {j.number}</div>
                        <div style={{ fontSize: 15, fontWeight: 800, fontFamily: "'DM Serif Display',serif", color: C.text, lineHeight: 1.2 }}>{j.title}</div>
                        <div style={{ fontSize: 11, color: C.muted, marginTop: 3 }}>{j.facilitator} · {j.startDate} – {j.endDate}</div>
                      </div>
                    </div>

                    {/* Status + progress */}
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: isActive ? 10 : 0 }}>
                      <div style={{ padding: "4px 10px", background: ss.bg, borderRadius: 20, fontSize: 10, fontWeight: 700, color: ss.color }}>{ss.label}</div>
                      {isActive && <span style={{ fontSize: 11, fontWeight: 700, color: j.color }}>{j.score}% score · 🔥 {j.streak}d</span>}
                      {!isActive && <span style={{ fontSize: 11, color: C.muted }}>{j.startDate}</span>}
                    </div>

                    {isActive && (
                      <>
                        <PBar pct={Math.round((j.day / j.total) * 100)} color={j.color} h={5} />
                        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 5 }}>
                          <span style={{ fontSize: 10, color: C.muted }}>Day {j.day} of {j.total}</span>
                          <div style={{ display: "flex", gap: 4 }}>
                            {PHASES.map((p, i) => (
                              <div key={i} style={{ width: 16, height: 4, borderRadius: 2, background: i < j.phase ? p.color : C.border, opacity: i + 1 === j.phase ? 1 : i < j.phase ? 0.6 : 0.3 }} />
                            ))}
                          </div>
                        </div>
                      </>
                    )}

                    {!isActive && (
                      <div style={{ marginTop: 8, fontSize: 12, color: C.muted, fontStyle: "italic" }}>
                        {j.status === "upcoming" ? "Tap to preview — starts soon." : "Tap to view details."}
                      </div>
                    )}

                    {/* Tap indicator */}
                    <div style={{ position: "absolute", right: 16, bottom: 16, color: j.color, fontSize: 16, opacity: 0.4 }}>›</div>
                  </Card>
                </button>
              );
            })}
          </div>
        )}

        {/* ── ASSIGNMENTS ── */}
        {tab === "assignments" && (
          <div>
            <div style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: C.muted, letterSpacing: "0.1em", marginBottom: 3 }}>TRAINEE</div>
              <div style={{ fontSize: 20, fontWeight: 800, fontFamily: "'DM Serif Display',serif", color: C.text }}>My Assignments</div>
              <div style={{ fontSize: 13, color: C.muted, marginTop: 3 }}>Submit your work and track feedback.</div>
            </div>
            {myAssignments.map(a => {
              const statusColor = a.status === "submitted" ? C.accent : a.status === "overdue" ? C.rose : C.amber;
              return (
                <Card key={a.id} style={{ padding: "15px", marginBottom: 10, overflow: "hidden" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                    <div style={{ flex: 1, paddingRight: 10 }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: C.text }}>{a.title}</div>
                      <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>Due: Day {a.dueDay} · Type: {a.type}</div>
                    </div>
                    <Tag color={statusColor}>{a.status}</Tag>
                  </div>
                  {a.status === "submitted" && a.trainerRating && (
                    <div style={{ padding: "10px 12px", background: C.accentSoft, borderRadius: 10, border: `1px solid ${C.accentLight}44` }}>
                      <div style={{ fontSize: 10, fontWeight: 700, color: C.accent, marginBottom: 5 }}>TRAINER FEEDBACK</div>
                      <StarRating value={a.trainerRating} />
                      <div style={{ fontSize: 12, color: C.textSoft, marginTop: 5, lineHeight: 1.55 }}>{a.trainerNote}</div>
                    </div>
                  )}
                  {a.status !== "submitted" && (
                    <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                      <Btn small color={C.accent}>📎 Upload Document</Btn>
                      <Btn small color={C.teal}>🎙 Voice Note</Btn>
                    </div>
                  )}
                </Card>
              );
            })}
          </div>
        )}

        {/* ── QUIZ ── */}
        {tab === "quiz" && (
          <div>
            <div style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: C.muted, letterSpacing: "0.1em", marginBottom: 3 }}>FROM TRAINER</div>
              <div style={{ fontSize: 20, fontWeight: 800, fontFamily: "'DM Serif Display',serif", color: C.text }}>Active Quiz</div>
              <div style={{ fontSize: 13, color: C.muted, marginTop: 3 }}>SPIN Selling — Complete before Day 52.</div>
            </div>
            {!quizDone ? (
              <div>
                {QUIZ_QUESTIONS.map((q, i) => (
                  <Card key={q.id} style={{ padding: "15px", marginBottom: 12 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: C.text, marginBottom: 10 }}>{i+1}. {q.q}</div>
                    {q.options.map((opt, j) => (
                      <button key={j} onClick={() => setQuizAnswers({ ...quizAnswers, [q.id]: j })}
                        style={{ width: "100%", padding: "10px 12px", background: quizAnswers[q.id] === j ? C.accentSoft2 : C.subtle, border: `1.5px solid ${quizAnswers[q.id] === j ? C.accent : C.border}`, borderRadius: 10, textAlign: "left", cursor: "pointer", fontSize: 12, color: quizAnswers[q.id] === j ? C.accent : C.textSoft, fontWeight: quizAnswers[q.id] === j ? 700 : 400, marginBottom: 6 }}>
                        {opt}
                      </button>
                    ))}
                  </Card>
                ))}
                <Btn full onClick={() => Object.keys(quizAnswers).length === QUIZ_QUESTIONS.length && setQuizDone(true)}>Submit Quiz</Btn>
              </div>
            ) : (
              <Card style={{ padding: "28px", textAlign: "center" }}>
                <div style={{ fontSize: 40, marginBottom: 12 }}>✅</div>
                <div style={{ fontSize: 18, fontWeight: 700, color: C.accent, fontFamily: "'DM Serif Display',serif" }}>Quiz Submitted!</div>
                <div style={{ fontSize: 13, color: C.muted, marginTop: 6 }}>Your trainer will review and provide feedback shortly.</div>
              </Card>
            )}
          </div>
        )}

        {/* ── MESSAGES ── */}
        {tab === "messages" && <MessagingPanel role="trainee" userName={me.name} />}
      </div>
    </div>
  );
}

// MANAGER SECTION
// ════════════════════════════════════════════════════════════════════════
function ManagerSection() {
  const [tab, setTab] = useState("team");
  const [selectedMember, setSelectedMember] = useState(1);
  const [observations, setObservations] = useState(MANAGER_OBSERVATIONS);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ type: "Joint Visit", note: "", rating: 3 });
  const [submitted, setSubmitted] = useState(false);
  const [editedAssignment, setEditedAssignment] = useState(null);

  const myTeam = TEAM.filter(t => t.manager === "Layla Mansour");
  const member = myTeam.find(t => t.id === selectedMember) || myTeam[0];
  const memberWs = WORKSHOPS.find(w => w.id === member?.workshopId);
  const memberAssignments = ASSIGNMENTS.filter(a => a.traineeId === member?.id);
  const memberObs = observations.filter(o => o.teamId === member?.id);
  const statusConfig = { excellent: { color: C.accent, l: "Excellent" }, "on-track": { color: C.teal, l: "On Track" }, "needs-work": { color: C.amber, l: "Needs Work" }, "at-risk": { color: C.rose, l: "At Risk" } };

  const tabs = [{ id: "team", l: "My Team" }, { id: "assignments", l: "Assignments" }, { id: "messages", l: "Messages" }];

  return (
    <div style={{ paddingBottom: 100 }}>
      <div style={{ padding: "18px 16px 0", background: C.white, borderBottom: `1px solid ${C.border}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
          <Avatar initials="LM" color={C.amber} size={36} />
          <div>
            <div style={{ fontSize: 15, fontWeight: 800, color: C.text, fontFamily: "'DM Serif Display',serif" }}>Layla Mansour</div>
            <div style={{ fontSize: 11, color: C.amber }}>👔 District Manager · {myTeam.length} direct reports</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 0 }}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              style={{ padding: "9px 14px", background: "none", border: "none", borderBottom: `2.5px solid ${tab === t.id ? C.amber : "transparent"}`, color: tab === t.id ? C.amber : C.muted, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
              {t.l}
            </button>
          ))}
        </div>
      </div>

      <div style={{ padding: "18px 16px" }}>

        {tab === "team" && (
          <div>
            {/* Team member selector */}
            <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: "0.08em", marginBottom: 10 }}>MY DIRECT REPORTS</div>
            <div style={{ display: "flex", gap: 10, overflowX: "auto", paddingBottom: 8, marginBottom: 16 }}>
              {myTeam.map(t => {
                const sc = t.score > 80 ? C.accent : t.score > 60 ? C.teal : C.amber;
                const lastObs = observations.find(o => o.teamId === t.id);
                return (
                  <button key={t.id} onClick={() => setSelectedMember(t.id)}
                    style={{ flexShrink: 0, width: 100, padding: "12px 10px", background: selectedMember === t.id ? C.amberSoft : C.white, border: `1.5px solid ${selectedMember === t.id ? C.amber : C.border}`, borderRadius: 14, cursor: "pointer", textAlign: "center", boxShadow: C.shadow }}>
                    <Ring pct={t.score} color={sc} size={42} stroke={4} label={t.avatar} />
                    <div style={{ fontSize: 11, fontWeight: 700, color: C.text, marginTop: 7 }}>{t.name.split(" ")[0]}</div>
                    {lastObs && <div style={{ fontSize: 9, color: statusConfig[lastObs.status]?.color, marginTop: 2 }}>{statusConfig[lastObs.status]?.l}</div>}
                  </button>
                );
              })}
            </div>

            {member && (
              <div>
                {/* Member details */}
                <Card style={{ padding: "16px", marginBottom: 14 }}>
                  <div style={{ display: "flex", gap: 12, alignItems: "center", marginBottom: 12 }}>
                    <Ring pct={member.score} color={member.score > 80 ? C.accent : member.score > 60 ? C.teal : C.amber} size={52} stroke={4} label={member.avatar} />
                    <div>
                      <div style={{ fontSize: 15, fontWeight: 700, color: C.text, fontFamily: "'DM Serif Display',serif" }}>{member.name}</div>
                      <div style={{ fontSize: 12, color: C.muted }}>{member.role} · Phase {member.phase}/4 · 🔥 {member.streak}d</div>
                    </div>
                  </div>

                  {/* Workshop snapshot */}
                  {memberWs && (
                    <div style={{ padding: "11px 13px", background: C.accentSoft, borderRadius: 10, border: `1px solid ${C.accentLight}44`, marginBottom: 12 }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: C.accent, marginBottom: 6 }}>WORKSHOP: {memberWs.title}</div>
                      {memberWs.outcomes.map((o, i) => (
                        <div key={i} style={{ fontSize: 11, color: C.textSoft, marginBottom: 3 }}>• {o}</div>
                      ))}
                    </div>
                  )}

                  {/* Add observation */}
                  {!showForm ? (
                    <button onClick={() => setShowForm(true)}
                      style={{ width: "100%", padding: "11px", background: C.amberSoft, border: `1px dashed ${C.amber}55`, borderRadius: 12, cursor: "pointer", color: C.amber, fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                      ＋ Log Field Observation
                    </button>
                  ) : (
                    <div style={{ background: C.cardAlt, border: `1.5px solid ${C.amber}55`, borderRadius: 12, padding: "14px" }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: C.amber, marginBottom: 10 }}>NEW OBSERVATION — {member.name}</div>
                      <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
                        {["Joint Visit", "Coaching Session", "Remote Check-in"].map(t => (
                          <button key={t} onClick={() => setForm({ ...form, type: t })}
                            style={{ flex: 1, padding: "7px 4px", background: form.type === t ? C.amberSoft : C.subtle, border: `1px solid ${form.type === t ? C.amber+"55" : C.border}`, borderRadius: 8, cursor: "pointer", fontSize: 9, fontWeight: 700, color: form.type === t ? C.amber : C.muted }}>
                            {t}
                          </button>
                        ))}
                      </div>
                      <textarea value={form.note} onChange={e => setForm({ ...form, note: e.target.value })} rows={3}
                        placeholder="What did you observe? Reference the trainer's behavioral expectations."
                        style={{ width: "100%", background: C.white, border: `1px solid ${C.border}`, borderRadius: 9, padding: "10px 12px", color: C.text, fontSize: 12, outline: "none", resize: "none", fontFamily: "inherit", lineHeight: 1.6, marginBottom: 10 }} />
                      <div style={{ marginBottom: 10 }}>
                        <div style={{ fontSize: 11, color: C.muted, marginBottom: 6 }}>IMPLEMENTATION RATING</div>
                        <StarRating value={form.rating} onChange={v => setForm({ ...form, rating: v })} />
                      </div>
                      {submitted ? (
                        <div style={{ padding: "10px", background: C.amberSoft, borderRadius: 9, textAlign: "center", fontSize: 12, color: C.amber, fontWeight: 700 }}>✓ Observation saved</div>
                      ) : (
                        <div style={{ display: "flex", gap: 8 }}>
                          <Btn full color={C.amber} onClick={() => {
                            if (!form.note.trim()) return;
                            setObservations([{ id: `obs_${Date.now()}`, teamId: member.id, date: `Day ${member.streak + 2}`, type: form.type, rating: form.rating, status: form.rating >= 5 ? "excellent" : form.rating >= 4 ? "on-track" : form.rating >= 2 ? "needs-work" : "at-risk", note: form.note }, ...observations]);
                            setSubmitted(true); setTimeout(() => { setSubmitted(false); setShowForm(false); setForm({ type: "Joint Visit", note: "", rating: 3 }); }, 2000);
                          }}>Submit</Btn>
                          <Btn outline onClick={() => setShowForm(false)}>Cancel</Btn>
                        </div>
                      )}
                    </div>
                  )}
                </Card>

                {/* Observation log */}
                {memberObs.length > 0 && (
                  <div>
                    <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: "0.08em", marginBottom: 10 }}>OBSERVATION LOG</div>
                    {memberObs.map(o => {
                      const cfg = statusConfig[o.status];
                      return (
                        <Card key={o.id} style={{ padding: "14px 15px", marginBottom: 10, borderLeft: `3px solid ${cfg.color}` }}>
                          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                            <div style={{ fontSize: 12, fontWeight: 700, color: C.text }}>{o.type}</div>
                            <Tag color={cfg.color}>{cfg.l}</Tag>
                          </div>
                          <div style={{ fontSize: 11, color: C.muted, marginBottom: 6 }}>{o.date}</div>
                          <StarRating value={o.rating} size={16} />
                          <div style={{ fontSize: 12, color: C.textSoft, lineHeight: 1.6, marginTop: 7 }}>{o.note}</div>
                        </Card>
                      );
                    })}
                  </div>
                )}

                {/* Assignments with edit option */}
                {memberAssignments.length > 0 && (
                  <div>
                    <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, letterSpacing: "0.08em", marginBottom: 10 }}>ASSIGNMENTS</div>
                    {memberAssignments.map(a => (
                      <Card key={a.id} style={{ padding: "13px 15px", marginBottom: 8 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                          <div style={{ fontSize: 13, fontWeight: 700, color: C.text }}>{a.title}</div>
                          <Tag color={a.status === "submitted" ? C.accent : a.status === "overdue" ? C.rose : C.amber}>{a.status}</Tag>
                        </div>
                        <div style={{ fontSize: 11, color: C.muted, marginBottom: 8 }}>Due: Day {a.dueDay} · {a.type}</div>
                        {editedAssignment !== a.id ? (
                          <button onClick={() => setEditedAssignment(a.id)}
                            style={{ padding: "6px 12px", background: C.subtle, border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 11, color: C.textSoft, cursor: "pointer", fontWeight: 600 }}>
                            ✎ Edit to match real-life situation
                          </button>
                        ) : (
                          <div>
                            <textarea rows={2} placeholder={`Adapt this assignment for ${member.name}'s current field context…`}
                              style={{ width: "100%", background: C.subtle, border: `1px solid ${C.border}`, borderRadius: 9, padding: "9px 12px", fontSize: 12, color: C.text, outline: "none", resize: "none", fontFamily: "inherit", lineHeight: 1.5, marginBottom: 6 }} />
                            <div style={{ display: "flex", gap: 6 }}>
                              <Btn small color={C.amber}>Save Edit</Btn>
                              <Btn small outline onClick={() => setEditedAssignment(null)}>Cancel</Btn>
                            </div>
                          </div>
                        )}
                      </Card>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {tab === "assignments" && (
          <div>
            <SectionHead label="Manager View" title="Team Assignments" sub="Overview of all direct reports." />
            {myTeam.map(t => {
              const tAssignments = ASSIGNMENTS.filter(a => a.traineeId === t.id);
              if (!tAssignments.length) return null;
              return (
                <div key={t.id} style={{ marginBottom: 18 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: C.text, marginBottom: 8, display: "flex", alignItems: "center", gap: 8 }}>
                    <Avatar initials={t.avatar} color={C.accent} size={24} />{t.name}
                  </div>
                  {tAssignments.map(a => (
                    <Card key={a.id} style={{ padding: "11px 14px", marginBottom: 6, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div>
                        <div style={{ fontSize: 12, fontWeight: 700, color: C.text }}>{a.title}</div>
                        <div style={{ fontSize: 10, color: C.muted }}>Due Day {a.dueDay}</div>
                      </div>
                      <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                        {a.trainerRating && <StarRating value={a.trainerRating} size={14} />}
                        <Tag color={a.status === "submitted" ? C.accent : a.status === "overdue" ? C.rose : C.amber} small>{a.status}</Tag>
                      </div>
                    </Card>
                  ))}
                </div>
              );
            })}
          </div>
        )}

        {tab === "messages" && <MessagingPanel role="manager" userName="Layla Mansour" />}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════
// ROOT APP
// ════════════════════════════════════════════════════════════════════════
function App() {
  const [currentRole, setCurrentRole] = useState(null);
  const [showAI, setShowAI] = useState(false);
  const [showNotifications, setShowNotifications] = useState(false);
  const [notifs, setNotifs] = useState(NOTIFICATIONS);

  const roleConfig = {
    admin:   { color: C.purple, icon: "🏢", label: "Admin" },
    trainer: { color: C.accent, icon: "🎓", label: "Trainer" },
    trainee: { color: C.teal,   icon: "👤", label: "Trainee" },
    manager: { color: C.amber,  icon: "👔", label: "Manager" },
  };

  if (!currentRole) return (
    <div style={{ fontFamily: "'Syne',sans-serif", maxWidth: 430, margin: "0 auto" }}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
      <style>{`* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; } body { background:${C.bg}; } ::-webkit-scrollbar{display:none;} button{font-family:'Syne',sans-serif;} input,textarea{font-family:'Syne',sans-serif; -webkit-appearance:none;} input::placeholder,textarea::placeholder{color:${C.muted};} @keyframes dot{0%,100%{opacity:.3;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}`}</style>
      <LoginScreen onLogin={setCurrentRole} />
    </div>
  );

  const cfg = roleConfig[currentRole];
  const sections = { admin: <AdminSection />, trainer: <TrainerSection />, trainee: <TraineeSection />, manager: <ManagerSection /> };
  const unreadCount = (notifs[currentRole] || []).filter(n => !n.read).length;

  return (
    <div style={{ fontFamily: "'Syne',sans-serif", background: C.bg, color: C.text, minHeight: "100vh", maxWidth: 430, margin: "0 auto", position: "relative" }}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
      <style>{`* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; } body { background:${C.bg}; } ::-webkit-scrollbar{display:none;} button{font-family:'Syne',sans-serif;} input,textarea{font-family:'Syne',sans-serif; -webkit-appearance:none;} input::placeholder,textarea::placeholder{color:${C.muted};} @keyframes dot{0%,100%{opacity:.3;transform:scale(.75)}50%{opacity:1;transform:scale(1)}} @keyframes slideDown{from{transform:translateY(-30px);opacity:0}to{transform:translateY(0);opacity:1}}`}</style>

      {/* Top bar */}
      <div style={{ position: "sticky", top: 0, zIndex: 100, background: `${C.white}EE`, backdropFilter: "blur(14px)", borderBottom: `1px solid ${C.border}`, padding: "12px 18px", display: "flex", justifyContent: "space-between", alignItems: "center", boxShadow: "0 1px 8px rgba(26,122,74,0.07)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
          <div style={{ width: 30, height: 30, borderRadius: 8, background: `linear-gradient(135deg,${C.accent},${C.accentLight})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, color: C.white, boxShadow: "0 2px 8px rgba(26,122,74,0.25)" }}>◈</div>
          <div>
            <div style={{ fontSize: 12, fontWeight: 800, color: C.text, fontFamily: "'DM Serif Display',serif", lineHeight: 1 }}>BRP</div>
            <div style={{ fontSize: 9, color: C.muted, letterSpacing: "0.06em" }}>90-DAY JOURNEYS</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <div style={{ padding: "4px 10px", background: `${cfg.color}15`, border: `1px solid ${cfg.color}44`, borderRadius: 20, fontSize: 10, color: cfg.color, fontWeight: 700 }}>{cfg.icon} {cfg.label}</div>
          {/* Notification bell */}
          <button onClick={() => setShowNotifications(true)}
            style={{ width: 34, height: 34, borderRadius: "50%", background: C.subtle, border: `1px solid ${C.border}`, color: C.textSoft, fontSize: 15, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
            🔔
            {unreadCount > 0 && (
              <div style={{ position: "absolute", top: -3, right: -3, minWidth: 16, height: 16, borderRadius: 8, background: C.rose, color: C.white, fontSize: 9, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 4px", border: `1.5px solid ${C.white}` }}>{unreadCount}</div>
            )}
          </button>
          <button onClick={() => setShowAI(true)}
            style={{ width: 34, height: 34, borderRadius: "50%", background: `linear-gradient(135deg,${C.accent},${C.accentLight})`, border: "none", color: C.white, fontSize: 15, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 2px 8px rgba(26,122,74,0.3)" }}>✦</button>
          <button onClick={() => setCurrentRole(null)}
            style={{ width: 34, height: 34, borderRadius: "50%", background: C.subtle, border: `1px solid ${C.border}`, color: C.muted, fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>⟵</button>
        </div>
      </div>

      {/* Main content */}
      <div style={{ minHeight: "calc(100vh - 60px)" }}>
        {sections[currentRole]}
      </div>

      {showAI && <AIModal onClose={() => setShowAI(false)} />}
      {showNotifications && <NotificationsPanel items={notifs[currentRole] || []} onUpdate={(list) => setNotifs({ ...notifs, [currentRole]: list })} onClose={() => setShowNotifications(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
